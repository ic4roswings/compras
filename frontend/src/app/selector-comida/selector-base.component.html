<div class="dropdown w-100">
  <button class="btn modern-btn-secondary w-100 d-flex justify-content-between align-items-center p-2 px-3"
    type="button" data-bs-toggle="dropdown" [attr.data-bs-popper-config]="popper()" (click)="busqueda.set('')">
    <div class="d-flex align-items-center gap-2">
      <fa-icon [icon]="faDrumstickBite" class="text-white-50"></fa-icon>
      <span class="text-white-50 small uppercase font-weight-bold d-none d-sm-inline">Base:</span>
      <span class="fw-bold">{{ valor() || vacio() }}</span>
    </div>
    <fa-icon [icon]="faChevronDown" class="small opacity-50"></fa-icon>
  </button>
  <ul class="dropdown-menu dropdown-menu-dark glass-dropdown w-100 shadow-lg mt-2"
    style="max-height: 350px; overflow-y: auto; overflow-x: hidden;">
    <li class="px-3 py-2 sticky-top bg-dark">
      <div class="search-box">
        <fa-icon [icon]="faSearch" class="search-icon"></fa-icon>
        <input type="text" class="form-control search-input" placeholder="Buscar o crear base..." maxlength="50"
          autocomplete="off" [value]="busqueda()" (input)="busqueda.set($any($event.target).value)"
          (keydown.enter)="onEnter(); $event.preventDefault()" (click)="$event.stopPropagation()">
      </div>
    </li>
    @if (permiteQuitar() && valor() && !busqueda()) {
    <li><a class="dropdown-item py-2" (click)="elige('')">Sin base</a></li>
    }
    @for (b of filtradas(); track b) {
    <li><a class="dropdown-item py-2" [class.activa]="b === valor()" (click)="elige(b)">{{ b }}</a></li>
    }
    @if (puedeCrear()) {
    <li>
      <a class="dropdown-item py-2" (click)="crea()">
        <fa-icon [icon]="faPlus" class="me-2"></fa-icon>Crear "{{ busqueda().trim() }}"
      </a>
    </li>
    }
  </ul>
</div>
